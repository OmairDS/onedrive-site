<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملفاتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5f3ee; --ink:#111111; --lime:#d7f26b; --blue:#1d2fe0; --pink:#ff9ecf;
  --yellow:#ffd23f; --sky:#9ad7ff; --orange:#ffb27a; --white:#ffffff; --muted:#5b5b57;
  --shadow:5px 5px 0 var(--ink);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--cream); color:var(--ink); min-height:100vh;
  font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif; font-size:16px;
  background-image:radial-gradient(rgba(17,17,17,.08) 1.2px, transparent 1.2px);
  background-size:22px 22px;
}
.wrap{max-width:980px;margin:0 auto;padding:18px 18px 70px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--ink);color:#fff;border-radius:999px;padding:8px 10px 8px 18px;margin-bottom:34px}
.bar .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;padding-inline-start:8px}
.bar .logo i{font-style:normal;background:var(--lime);color:var(--ink);width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;font-size:16px}
.pill-btn{border:0;background:var(--lime);color:var(--ink);font-family:inherit;font-weight:800;font-size:14px;
  border-radius:999px;padding:8px 18px;cursor:pointer}
.pill-btn:hover{filter:brightness(.95)}

/* hero */
.hero{margin-bottom:26px}
h1{margin:0 0 12px;font-size:clamp(34px,7vw,64px);line-height:1.15;font-weight:800;letter-spacing:-.5px}
h1 mark{background:var(--lime);padding:0 .25em;border-radius:.3em;display:inline-block;transform:rotate(-1.2deg)}
.sub{color:var(--muted);font-size:clamp(15px,2.4vw,19px);max-width:560px;margin:0}

/* stat stickers */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 8px}
.stat{border:3px solid var(--ink);border-radius:16px;padding:10px 18px;box-shadow:var(--shadow);min-width:120px}
.stat:nth-child(1){background:var(--yellow);transform:rotate(-1.5deg)}
.stat:nth-child(2){background:var(--pink);transform:rotate(1deg)}
.stat:nth-child(3){background:var(--sky);transform:rotate(-.8deg)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:13px;font-weight:500}

/* controls */
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 8px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:15px 50px;border-radius:999px;border:3px solid var(--ink);background:var(--white);
  font-family:inherit;font-size:16px;font-weight:500;outline:none;box-shadow:var(--shadow)}
.search input:focus{box-shadow:5px 5px 0 var(--blue);border-color:var(--ink)}
.search i{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%);font-style:normal}
select{padding:14px 18px;border-radius:999px;border:3px solid var(--ink);background:var(--white);font-family:inherit;
  font-size:15px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}

/* breadcrumbs */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:24px 0 6px;font-weight:800;font-size:15px}
.crumbs a{color:var(--blue);text-decoration:none;padding:4px 12px;border-radius:999px;border:2px solid transparent}
.crumbs a:hover{border-color:var(--blue)}
.crumbs .cur{background:var(--ink);color:#fff;padding:4px 14px;border-radius:999px}
.crumbs .sep{opacity:.4}

.sec{display:inline-block;margin:26px 0 14px;font-weight:800;font-size:15px;background:var(--ink);color:var(--lime);
  padding:5px 16px;border-radius:999px}

/* folders */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.folder{display:flex;align-items:center;gap:14px;padding:16px;border:3px solid var(--ink);border-radius:18px;
  text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s}
.folder:hover{transform:translate(-2px,-3px) rotate(-1deg);box-shadow:8px 8px 0 var(--ink)}
.folder .ico{width:46px;height:46px;border-radius:50%;background:var(--white);border:3px solid var(--ink);
  display:grid;place-items:center;font-size:22px;flex:none}
.folder>div{min-width:0}
.folder .nm{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .ct{font-size:13px;font-weight:500;margin-top:2px}

/* files */
.list{display:flex;flex-direction:column;gap:12px}
.file{display:flex;align-items:center;gap:14px;padding:12px 14px;border:3px solid var(--ink);border-radius:18px;
  background:var(--white);box-shadow:var(--shadow);transition:transform .15s}
.file:hover{transform:translate(-2px,-2px)}
.badge{width:52px;height:52px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;flex:none;
  font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--ink);direction:ltr}
.info{flex:1;min-width:0}
.info a{color:var(--ink);text-decoration:none;font-weight:800;font-size:17px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info a:hover{color:var(--blue)}
.meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-weight:500}
.new{background:var(--lime);color:var(--ink);border:2px solid var(--ink);padding:0 10px;border-radius:999px;font-weight:800;
  font-size:12px;transform:rotate(-3deg)}
.path{color:var(--blue)}
.dl{flex:none;text-decoration:none;background:var(--blue);color:#fff;font-weight:800;font-size:14px;
  border:3px solid var(--ink);border-radius:999px;padding:8px 18px;box-shadow:3px 3px 0 var(--ink)}
.dl:hover{background:var(--ink)}

.empty{text-align:center;padding:50px 10px;border:3px dashed var(--ink);border-radius:20px;font-weight:800;background:var(--white)}
.foot{margin-top:40px;text-align:center;font-size:13px;color:var(--muted);font-weight:500}
@media(max-width:560px){.dl span{display:none}.dl{padding:8px 12px}.stat{flex:1;min-width:100px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="logo"><i>&#128193;</i><span id="brand">ملفاتنا</span></div>
    <button class="pill-btn" id="lang">EN</button>
  </div>

  <div class="hero">
    <h1><span id="h1a">كل ملفاتك</span> <mark id="h1b">في مكان واحد</mark></h1>
    <p class="sub" id="sub"></p>
    <div class="stats" id="stats"></div>
  </div>

  <div class="controls">
    <div class="search"><i>&#128269;</i><input id="q" autocomplete="off"></div>
    <select id="sort"></select>
  </div>

  <div class="crumbs" id="crumbs"></div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
const WEEK = 7 * 24 * 3600 * 1000;
const STR = {
  ar: { title:"ملفاتنا", h1a:"كل ملفاتك", h1b:"في مكان واحد", sub:"تصفّح وحمّل الملفات المشاركة بسهولة.",
        search:"ابحث في كل الملفات والمجلدات...", name:"الترتيب: الاسم", newest:"الترتيب: الأحدث", largest:"الترتيب: الأكبر",
        home:"الرئيسية", folders:"المجلدات", files:"الملفات", results:"نتائج البحث", clear:"مسح",
        empty:"هذا المجلد فارغ.", nomatch:q=>`لا توجد نتائج لـ "${q}".`, loading:"جارٍ التحميل...",
        fail:"تعذّر تحميل قائمة الملفات.", dl:"تحميل", tag:"جديد", item:"عنصر", file:"ملف", folder:"مجلد",
        total:"الحجم الكلي", updated:"آخر تحديث", other:"EN", loc:"ar-SA-u-ca-gregory-nu-latn" },
  en: { title:"Our Files", h1a:"All your files", h1b:"in one place", sub:"Browse and download shared files with ease.",
        search:"Search all files and folders...", name:"Sort: Name", newest:"Sort: Newest", largest:"Sort: Largest",
        home:"Home", folders:"Folders", files:"Files", results:"Search results", clear:"clear",
        empty:"This folder is empty.", nomatch:q=>`Nothing matches "${q}".`, loading:"Loading...",
        fail:"Could not load the file list.", dl:"Download", tag:"NEW", item:"items", file:"files", folder:"folders",
        total:"Total size", updated:"Last updated", other:"عربي", loc:"en-GB" }
};
let lang = (() => { try { return localStorage.getItem("lang") || "ar"; } catch (e) { return "ar"; } })();
const T = k => STR[lang][k];

const arr = x => x == null ? [] : [].concat(x);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtSize = b => b >= 1073741824 ? (b/1073741824).toFixed(1)+" GB" : b >= 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1, Math.ceil(b/1024))+" KB";
const fmtDate = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString(T("loc"), {year:"numeric", month:"short", day:"numeric"}); };
const fileHref = p => "files/" + p.split("/").map(encodeURIComponent).join("/");
const hashFor = parts => "#/" + parts.map(encodeURIComponent).join("/");
const ext = n => { const i = n.lastIndexOf("."); return i > 0 ? n.slice(i+1).toLowerCase() : ""; };

const TYPES = {
  pdf:"#ff8a8a", html:"#ffb27a", htm:"#ffb27a", ppt:"#ffb27a", pptx:"#ffb27a",
  xls:"#b7e68a", xlsx:"#b7e68a", csv:"#b7e68a", doc:"#9ad7ff", docx:"#9ad7ff",
  png:"#d3b8ff", jpg:"#d3b8ff", jpeg:"#d3b8ff", gif:"#d3b8ff", svg:"#d3b8ff", webp:"#d3b8ff",
  mp4:"#ff9ecf", mov:"#ff9ecf", mp3:"#ff9ecf", wav:"#ff9ecf",
  zip:"#d9d6cc", rar:"#d9d6cc", "7z":"#d9d6cc", py:"#ffd23f", js:"#ffd23f", json:"#ffd23f", ps1:"#9ad7ff"
};
const FOLDER_COLORS = ["#d7f26b", "#ffd23f", "#ff9ecf", "#9ad7ff", "#ffb27a"];

let data = [], updated = null;
const $ = id => document.getElementById(id);
const children = n => arr(n.children);

function countAll(items) {
  let f = 0, d = 0, bytes = 0;
  arr(items).forEach(i => {
    if (i.isFolder) { d++; const c = countAll(i.children); f += c.f; d += c.d; bytes += c.bytes; }
    else { f++; bytes += i.size || 0; }
  });
  return {f, d, bytes};
}
function nodeAt(parts) {
  let items = data;
  for (const name of parts) {
    const hit = items.find(i => i.isFolder && i.name === name);
    if (!hit) return null;
    items = children(hit);
  }
  return items;
}
function flatten(items, out = []) { arr(items).forEach(i => { out.push(i); if (i.isFolder) flatten(i.children, out); }); return out; }
function sortItems(list) {
  const cmp = {
    name: (a, b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:"base"}),
    new:  (a, b) => new Date(b.modified || 0) - new Date(a.modified || 0),
    size: (a, b) => (b.size || 0) - (a.size || 0)
  }[$("sort").value];
  return list.slice().sort(cmp);
}

function fileRow(i, showPath) {
  const e = ext(i.name), col = TYPES[e] || "#e6e3da";
  const isNew = Date.now() - new Date(i.modified) < WEEK;
  const dir = i.path.includes("/") ? i.path.slice(0, i.path.lastIndexOf("/")) : "";
  return `<div class="file">
    <div class="badge" style="background:${col}">${esc((e || "FILE").slice(0,4).toUpperCase())}</div>
    <div class="info">
      <a dir="auto" href="${fileHref(i.path)}" target="_blank" rel="noopener">${esc(i.name)}</a>
      <div class="meta">
        <span dir="ltr">${fmtSize(i.size || 0)}</span>
        <span>${fmtDate(i.modified)}</span>
        ${showPath && dir ? `<span class="path" dir="auto">${esc(dir)}</span>` : ""}
        ${isNew ? `<span class="new">${T("tag")}</span>` : ""}
      </div>
    </div>
    <a class="dl" href="${fileHref(i.path)}" download>&#11015; <span>${T("dl")}</span></a>
  </div>`;
}
function folderCard(i, idx) {
  const c = countAll(i.children), direct = children(i).length;
  return `<a class="folder" style="background:${FOLDER_COLORS[idx % FOLDER_COLORS.length]}" href="${hashFor(i.path.split("/"))}">
    <div class="ico">&#128194;</div>
    <div><div class="nm" dir="auto">${esc(i.name)}</div>
    <div class="ct">${direct} ${T("item")} &middot; ${c.f} ${T("file")}</div></div>
  </a>`;
}
function currentParts() {
  const h = location.hash.replace(/^#\/?/, "");
  return h ? h.split("/").map(decodeURIComponent).filter(Boolean) : [];
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = T("title");
  $("brand").textContent = T("title");
  $("h1a").textContent = T("h1a");
  $("h1b").textContent = T("h1b");
  $("sub").textContent = T("sub");
  $("q").placeholder = T("search");
  $("lang").textContent = T("other");
  const cur = $("sort").value || "name";
  $("sort").innerHTML = `<option value="name">${T("name")}</option><option value="new">${T("newest")}</option><option value="size">${T("largest")}</option>`;
  $("sort").value = cur;
}

function stats() {
  const c = countAll(data);
  $("stats").innerHTML =
    `<div class="stat"><b>${c.f}</b><span>${T("files")}</span></div>
     <div class="stat"><b>${c.d}</b><span>${T("folders")}</span></div>
     <div class="stat"><b dir="ltr">${fmtSize(c.bytes)}</b><span>${T("total")}</span></div>`;
  $("foot").textContent = updated ? T("updated") + ": " + updated.toLocaleString(T("loc")) : "";
}

function draw() {
  const q = $("q").value.trim().toLowerCase();
  const parts = currentParts();
  let node = nodeAt(parts);
  if (node === null) { node = data; parts.length = 0; }

  let crumbs = parts.length ? `<a href="#/">${T("home")}</a>` : `<span class="cur">${T("home")}</span>`;
  parts.forEach((p, idx) => {
    crumbs += `<span class="sep">/</span>`;
    crumbs += idx === parts.length - 1
      ? `<span class="cur" dir="auto">${esc(p)}</span>`
      : `<a dir="auto" href="${hashFor(parts.slice(0, idx + 1))}">${esc(p)}</a>`;
  });
  $("crumbs").innerHTML = q ? `<span class="cur">${T("results")}</span><a href="#" id="clr">${T("clear")}</a>` : crumbs;
  const clr = $("clr"); if (clr) clr.onclick = e => { e.preventDefault(); $("q").value = ""; draw(); };

  let html = "";
  if (q) {
    const hits = flatten(data).filter(i => i.name.toLowerCase().includes(q));
    const folders = sortItems(hits.filter(i => i.isFolder)), files = sortItems(hits.filter(i => !i.isFolder));
    if (folders.length) html += `<div class="sec">${T("folders")} (${folders.length})</div><div class="grid">${folders.map(folderCard).join("")}</div>`;
    if (files.length) html += `<div class="sec">${T("files")} (${files.length})</div><div class="list">${files.map(i => fileRow(i, true)).join("")}</div>`;
    if (!html) html = `<div class="empty">${esc(T("nomatch")(q))}</div>`;
  } else {
    const folders = sortItems(node.filter(i => i.isFolder)), files = sortItems(node.filter(i => !i.isFolder));
    if (folders.length) html += `<div class="sec">${T("folders")}</div><div class="grid">${folders.map(folderCard).join("")}</div>`;
    if (files.length) html += `<div class="sec">${T("files")}</div><div class="list">${files.map(i => fileRow(i, false)).join("")}</div>`;
    if (!html) html = `<div class="empty">${T("empty")}</div>`;
  }
  $("app").innerHTML = html;
}

$("lang").onclick = () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyLang(); stats(); draw();
};
$("q").addEventListener("input", draw);
$("sort").addEventListener("change", draw);
window.addEventListener("hashchange", () => { $("q").value = ""; draw(); window.scrollTo(0, 0); });

applyLang();
$("app").innerHTML = `<div class="empty">${T("loading")}</div>`;
fetch("files.json?" + Date.now())
  .then(r => { const lm = r.headers.get("Last-Modified"); if (lm) updated = new Date(lm); return r.json(); })
  .then(d => { data = arr(d); stats(); draw(); })
  .catch(() => { $("app").innerHTML = `<div class="empty">${T("fail")}</div>`; });
</script>
</body>
</html>
