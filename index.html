<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<style>
:root{
  --bg:#0f1e2e; --panel:#15293F; --card:#1b3350; --card-hover:#223d5e;
  --line:rgba(255,255,255,.09); --text:#eaf1f8; --muted:#93a7bc;
  --teal:#2E9E8F; --gold:#C9A227; --navy:#1F3864; --r:14px;
  --shadow:0 6px 24px rgba(0,0,0,.25);
}
[data-theme="light"]{
  --bg:#f2f5f9; --panel:#ffffff; --card:#ffffff; --card-hover:#f4f8fb;
  --line:rgba(21,41,63,.12); --text:#15293F; --muted:#5d7288;
  --shadow:0 6px 24px rgba(21,41,63,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Trebuchet MS",Calibri,system-ui,sans-serif; min-height:100vh;
  background-image:radial-gradient(1200px 500px at 85% -10%, rgba(46,158,143,.18), transparent 60%),
                   radial-gradient(900px 400px at -10% 0%, rgba(201,162,39,.10), transparent 60%);
  background-attachment:fixed;
}
.wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;font-size:22px;box-shadow:var(--shadow)}
h1{margin:0;font-size:24px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;
  width:40px;height:40px;cursor:pointer;font-size:18px}
.tbtn:hover{border-color:var(--teal)}

/* stats */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-size:20px;color:var(--teal)}
.stat span{font-size:12px;color:var(--muted)}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:15px;font-family:inherit;outline:none}
.search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,158,143,.2)}
.search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.6}
select{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  font-family:inherit;font-size:14px;cursor:pointer}

/* breadcrumb */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 16px;font-size:14px;color:var(--muted)}
.crumbs a{color:var(--teal);text-decoration:none;padding:4px 8px;border-radius:8px}
.crumbs a:hover{background:rgba(46,158,143,.14)}
.crumbs .cur{color:var(--text);font-weight:700;padding:4px 8px}

/* section titles */
.sec{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin:22px 0 10px;font-weight:700}

/* folders */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.folder{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--line);text-decoration:none;color:var(--text);transition:.15s}
.folder:hover{background:var(--card-hover);transform:translateY(-2px);border-color:var(--teal);box-shadow:var(--shadow)}
.folder .ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:21px;
  background:rgba(201,162,39,.16);flex:none}
.folder .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .ct{font-size:12px;color:var(--muted);margin-top:2px}
.folder>div{min-width:0}

/* files */
.list{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--line);transition:.15s}
.file:hover{background:var(--card-hover);border-color:var(--teal)}
.badge{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-size:11px;font-weight:800;color:#fff;letter-spacing:.5px}
.info{flex:1;min-width:0}
.info a{color:var(--text);text-decoration:none;font-weight:700;font-size:15px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info a:hover{color:var(--teal)}
.meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.new{background:rgba(46,158,143,.2);color:var(--teal);padding:1px 8px;border-radius:999px;font-weight:700;font-size:11px}
.dl{flex:none;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:13px}
.dl:hover{color:#fff;background:var(--teal);border-color:var(--teal)}
.path{color:var(--gold)}

.empty{text-align:center;color:var(--muted);padding:50px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.foot{margin-top:34px;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:560px){.dl span{display:none}.stat{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">&#128193;</div>
      <div>
        <h1 id="title">Files</h1>
        <div class="sub">Browse and download shared files</div>
      </div>
    </div>
    <button class="tbtn" id="theme" title="Light / dark">&#9788;</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="search"><i>&#128269;</i><input id="q" placeholder="Search all files and folders..." autocomplete="off"></div>
    <select id="sort">
      <option value="name">Sort: Name</option>
      <option value="new">Sort: Newest</option>
      <option value="size">Sort: Largest</option>
    </select>
  </div>

  <div class="crumbs" id="crumbs"></div>
  <div id="app"><div class="empty">Loading...</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
const WEEK = 7 * 24 * 3600 * 1000;
const arr = x => x == null ? [] : [].concat(x);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtSize = b => b >= 1073741824 ? (b/1073741824).toFixed(1)+" GB"
                  : b >= 1048576 ? (b/1048576).toFixed(1)+" MB"
                  : Math.max(1, Math.ceil(b/1024))+" KB";
const fmtDate = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"}); };
const fileHref = p => "files/" + p.split("/").map(encodeURIComponent).join("/");
const hashFor = parts => "#/" + parts.map(encodeURIComponent).join("/");

const TYPES = {
  pdf:"#d64545", html:"#e8803a", htm:"#e8803a", ppt:"#d9622b", pptx:"#d9622b",
  xls:"#2e9e5b", xlsx:"#2e9e5b", csv:"#2e9e5b", doc:"#3b7dd8", docx:"#3b7dd8",
  png:"#8b5cf6", jpg:"#8b5cf6", jpeg:"#8b5cf6", gif:"#8b5cf6", svg:"#8b5cf6", webp:"#8b5cf6",
  mp4:"#d6479b", mov:"#d6479b", mp3:"#d6479b", wav:"#d6479b",
  zip:"#6b7c93", rar:"#6b7c93", "7z":"#6b7c93",
  py:"#3572a5", js:"#c9a227", json:"#c9a227", ps1:"#3b7dd8", txt:"#6b7c93", md:"#6b7c93"
};
const ext = n => { const i = n.lastIndexOf("."); return i > 0 ? n.slice(i+1).toLowerCase() : ""; };

let data = [], updated = null;
const $ = id => document.getElementById(id);

function children(node) { return arr(node.children); }
function countAll(items) {
  let f = 0, d = 0, bytes = 0;
  arr(items).forEach(i => {
    if (i.isFolder) { d++; const c = countAll(i.children); f += c.f; d += c.d; bytes += c.bytes; }
    else { f++; bytes += i.size || 0; }
  });
  return {f, d, bytes};
}
function nodeAt(parts) {
  let items = data;
  for (const name of parts) {
    const hit = items.find(i => i.isFolder && i.name === name);
    if (!hit) return null;
    items = children(hit);
  }
  return items;
}
function flatten(items, out = []) {
  arr(items).forEach(i => { out.push(i); if (i.isFolder) flatten(i.children, out); });
  return out;
}
function sortItems(list) {
  const mode = $("sort").value;
  const cmp = {
    name: (a, b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:"base"}),
    new:  (a, b) => new Date(b.modified || 0) - new Date(a.modified || 0),
    size: (a, b) => (b.size || 0) - (a.size || 0)
  }[mode];
  return list.slice().sort(cmp);
}

function fileRow(i, showPath) {
  const e = ext(i.name), col = TYPES[e] || "#6b7c93";
  const isNew = Date.now() - new Date(i.modified) < WEEK;
  const dir = i.path.includes("/") ? i.path.slice(0, i.path.lastIndexOf("/")) : "";
  return `<div class="file">
    <div class="badge" style="background:${col}">${esc((e || "FILE").slice(0,4).toUpperCase())}</div>
    <div class="info">
      <a dir="auto" href="${fileHref(i.path)}" target="_blank" rel="noopener">${esc(i.name)}</a>
      <div class="meta">
        <span>${fmtSize(i.size || 0)}</span>
        <span>${fmtDate(i.modified)}</span>
        ${showPath && dir ? `<span class="path" dir="auto">${esc(dir)}</span>` : ""}
        ${isNew ? '<span class="new">NEW</span>' : ""}
      </div>
    </div>
    <a class="dl" href="${fileHref(i.path)}" download title="Download">&#11015; <span>Download</span></a>
  </div>`;
}
function folderCard(i) {
  const c = countAll(i.children);
  const direct = children(i).length;
  return `<a class="folder" href="${hashFor(i.path.split("/"))}">
    <div class="ico">&#128194;</div>
    <div><div class="nm" dir="auto">${esc(i.name)}</div>
    <div class="ct">${direct} item${direct === 1 ? "" : "s"} &middot; ${c.f} file${c.f === 1 ? "" : "s"}</div></div>
  </a>`;
}

function currentParts() {
  const h = location.hash.replace(/^#\/?/, "");
  return h ? h.split("/").map(decodeURIComponent).filter(Boolean) : [];
}

function draw() {
  const q = $("q").value.trim().toLowerCase();
  const parts = currentParts();
  let node = nodeAt(parts);
  if (node === null) { node = data; parts.length = 0; }

  // breadcrumbs
  let crumbs = parts.length ? `<a href="#/">Home</a>` : `<span class="cur">Home</span>`;
  parts.forEach((p, idx) => {
    crumbs += " / ";
    crumbs += idx === parts.length - 1
      ? `<span class="cur" dir="auto">${esc(p)}</span>`
      : `<a dir="auto" href="${hashFor(parts.slice(0, idx + 1))}">${esc(p)}</a>`;
  });
  $("crumbs").innerHTML = q ? `<span class="cur">Search results</span> <a href="#" id="clr">clear</a>` : crumbs;
  const clr = $("clr"); if (clr) clr.onclick = e => { e.preventDefault(); $("q").value = ""; draw(); };

  let html = "";
  if (q) {
    const hits = flatten(data).filter(i => i.name.toLowerCase().includes(q));
    const folders = sortItems(hits.filter(i => i.isFolder));
    const files = sortItems(hits.filter(i => !i.isFolder));
    if (folders.length) html += `<div class="sec">Folders (${folders.length})</div><div class="grid">${folders.map(folderCard).join("")}</div>`;
    if (files.length) html += `<div class="sec">Files (${files.length})</div><div class="list">${files.map(i => fileRow(i, true)).join("")}</div>`;
    if (!html) html = `<div class="empty">Nothing matches "${esc(q)}".</div>`;
  } else {
    const folders = sortItems(node.filter(i => i.isFolder));
    const files = sortItems(node.filter(i => !i.isFolder));
    if (folders.length) html += `<div class="sec">Folders</div><div class="grid">${folders.map(folderCard).join("")}</div>`;
    if (files.length) html += `<div class="sec">Files</div><div class="list">${files.map(i => fileRow(i, false)).join("")}</div>`;
    if (!html) html = `<div class="empty">This folder is empty.</div>`;
  }
  $("app").innerHTML = html;
  document.title = parts.length ? parts[parts.length - 1] + " - Files" : "Files";
}

function stats() {
  const c = countAll(data);
  $("stats").innerHTML =
    `<div class="stat"><b>${c.f}</b><span>Files</span></div>
     <div class="stat"><b>${c.d}</b><span>Folders</span></div>
     <div class="stat"><b>${fmtSize(c.bytes)}</b><span>Total size</span></div>`;
  $("foot").textContent = updated ? "Last updated " + updated.toLocaleString() : "";
}

// theme
const saved = (() => { try { return localStorage.getItem("theme"); } catch (e) { return null; } })();
if (saved) document.documentElement.setAttribute("data-theme", saved);
$("theme").onclick = () => {
  const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
};

$("q").addEventListener("input", draw);
$("sort").addEventListener("change", draw);
window.addEventListener("hashchange", () => { $("q").value = ""; draw(); window.scrollTo(0, 0); });

fetch("files.json?" + Date.now())
  .then(r => { const lm = r.headers.get("Last-Modified"); if (lm) updated = new Date(lm); return r.json(); })
  .then(d => { data = arr(d); stats(); draw(); })
  .catch(() => { $("app").innerHTML = '<div class="empty">Could not load the file list.</div>'; });
</script>
</body>
</html>
